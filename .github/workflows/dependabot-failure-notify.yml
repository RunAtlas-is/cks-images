name: Dependabot failure notify

# Posts to Slack when CI fails on a Dependabot pull request. The CI workflow
# dispatches this workflow on the default branch with the failed run's ID, so
# the Slack token is only ever exposed to workflow and script code from the
# default branch, never to a pull request's revision. The script reads the run
# back from the API and posts only for a failed Dependabot pull request run of
# CI from a branch of this repository; event payload fields never reach it.
#
# Self-contained variant of the org Dependabot failure notifier
# (RunAtlas-is/.github/.github/actions/dependabot-failure-notify). This
# repository is public and GitHub does not allow a public repository to call
# reusable workflows or actions that live in a private repository, and it takes
# a dispatched run ID instead of a workflow_run event. Keep the message format
# and duplicate suppression in step with the org notifier.
#
# Manual test: run from the Actions tab with `test` checked. That posts a
# clearly labeled test message, verifying the token, channel, and posting
# mechanics.

on:
  workflow_dispatch:
    inputs:
      test:
        description: Post a test message to verify posting.
        required: true
        type: boolean
        default: true
      run_id:
        description: ID of the failed CI run to report.
        required: false
        type: string
        default: ""

permissions: {}

jobs:
  notify:
    if: vars.SLACK_CHANNEL_ID != '' && (inputs.test || inputs.run_id != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3

      - name: Notify Slack
        env:
          GH_TOKEN: ${{ github.token }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          CI_WORKFLOWS: "CI"
          REPO: ${{ github.repository }}
          NOTIFY_TEST: ${{ inputs.test }}
          RUN_ID: ${{ inputs.run_id }}
        run: bun .github/scripts/dependabot-failure-notify.ts
