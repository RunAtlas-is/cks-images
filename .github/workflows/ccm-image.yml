name: CCM image

# Builds the CloudStack cloud controller manager (CCM) that the CKS ISOs ship,
# from apache/cloudstack-kubernetes-provider at a pinned commit, and publishes
# it to GHCR. ISO builds reference the published image by digest
# (CCM_IMAGE in cks-images.yml), never by tag, so a rebuild here changes
# nothing until that digest is updated deliberately.
#
# The pinned commit carries the upstream fix that replaced the Admin-only
# listManagementServersMetrics call with listCapabilities; the v1.2.0 release
# exits at start-up with API error 432 for every non-root-admin account, so
# tenant clusters get no LoadBalancer addresses
# (https://github.com/apache/cloudstack-kubernetes-provider/issues/94).
# Move to an upstream release tag once one contains that fix.
#
# Pull requests build the image without pushing; pushes to main and manual
# runs publish it.

on:
  pull_request:
    paths:
      - .github/workflows/ccm-image.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/ccm-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ccm-image
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY: apache/cloudstack-kubernetes-provider
  # Keep equal to CCM_SOURCE_COMMIT in cks-images.yml when CCM_IMAGE there
  # names an image built from this workflow: the ISO takes its deployment
  # manifest from the same commit as the image.
  SOURCE_COMMIT: 5147f76478f66191513d8741ffd8800a35684fc2
  IMAGE: ghcr.io/runatlas-is/cloudstack-kubernetes-provider

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_COMMIT }}
          # The upstream Makefile derives the embedded version from
          # `git describe --tags`, which needs the history and tags.
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source revision
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          test "$head" = "$SOURCE_COMMIT" || { echo "checked out $head, expected $SOURCE_COMMIT" >&2; exit 1; }

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          # A plain image index without attestation manifests: the ISO build
          # pulls and exports the image with ctr, which handles only
          # platform manifests.
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE }}:${{ env.SOURCE_COMMIT }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_COMMIT }}
            org.opencontainers.image.url=https://github.com/${{ env.SOURCE_REPOSITORY }}
            org.opencontainers.image.description=CloudStack cloud controller manager built from ${{ env.SOURCE_REPOSITORY }}@${{ env.SOURCE_COMMIT }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Report digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "unexpected digest: $DIGEST" >&2; exit 1; }
          echo "Published ${IMAGE}@${DIGEST}" | tee -a "$GITHUB_STEP_SUMMARY"
