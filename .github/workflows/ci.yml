name: CI

# Validation gate for every pull request (including Dependabot bumps, which
# auto-merge only after this passes as a required status check) and for pushes
# to main. A failed Dependabot run dispatches the Slack notifier on the default
# branch; see dependabot-failure-notify.yml.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install index dependencies
        working-directory: index
        run: bun install --frozen-lockfile

      - name: Typecheck index
        working-directory: index
        run: bunx tsc --noEmit

      - name: Test index
        working-directory: index
        run: bun test

      - name: Lint shell scripts
        run: |
          set -euo pipefail
          bash -n scripts/*.sh
          shellcheck --severity=warning scripts/*.sh

      - name: Compile Python scripts
        run: python3 -m py_compile scripts/*.py

      - name: Check the revoked signing key
        run: ./scripts/check-revoked-key.sh keys/atlas-cloud-artifact-signing.asc 4C2D72FDDEF77A5CC4A7D2C421CA4588DCB6991E

  notify-dependabot-failure:
    name: Notify Dependabot failure
    needs: validate
    # Only a Dependabot pull request from a branch of this repository can
    # dispatch; a fork's token is read-only whatever this job requests. The job
    # uses no action, so a Dependabot bump of a pinned action in this file
    # cannot run code here with the actions:write token.
    if: >-
      failure() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch the failure notifier
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: >-
          gh workflow run dependabot-failure-notify.yml
          --repo "$GITHUB_REPOSITORY"
          --ref "$DEFAULT_BRANCH"
          -f test=false
          -f run_id="$RUN_ID"
